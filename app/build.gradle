plugins {
    id 'com.android.application'
}

def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: ''
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def keyAliasValue = System.getenv('ANDROID_KEY_ALIAS') ?: ''
def keyPasswordValue = System.getenv('ANDROID_KEY_PASSWORD') ?: ''
def expectedSigner = (System.getenv('EXPECTED_SIGNER_SHA256') ?: '').replace(':', '').replace(' ', '').toUpperCase()
def hasReleaseSigning = !keystorePath.isEmpty() && !keystorePassword.isEmpty() && !keyAliasValue.isEmpty() && !keyPasswordValue.isEmpty()
def enforceSignature = hasReleaseSigning && !expectedSigner.isEmpty()

android {
    namespace 'com.example.rootcatoggle'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.rootcatoggle'
        minSdk 24
        targetSdk 28
        versionCode 5
        versionName '0.2.3'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        hardenedRelease {
            if (hasReleaseSigning) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
            buildConfigField 'String', 'EXPECTED_SIGNER_SHA256', '""'
            buildConfigField 'boolean', 'SIGNATURE_ENFORCEMENT', 'false'
        }

        release {
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // A configured secret keystore gives stable updates + signature pinning.
            // Without secrets the build remains installable and R8-obfuscated, but uses
            // the runner debug signer and therefore cannot enforce anti-repackaging.
            signingConfig hasReleaseSigning ? signingConfigs.hardenedRelease : signingConfigs.debug
            buildConfigField 'String', 'EXPECTED_SIGNER_SHA256', '"' + expectedSigner + '"'
            buildConfigField 'boolean', 'SIGNATURE_ENFORCEMENT', enforceSignature ? 'true' : 'false'
        }
    }

    // This app is distributed by direct sideload for Android 7/VPhoneGaGa,
    // not through Google Play. Keep targetSdk 28 for the intended legacy runtime
    // behavior, while suppressing only the Play-target-age lint rule. Other fatal
    // release lint checks remain enabled.
    lint {
        abortOnError true
        checkReleaseBuilds true
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
